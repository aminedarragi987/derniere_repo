services:
  postgres:
    image: postgres:15
    container_name: postgresdb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: data2010.
      POSTGRES_DB: IAM
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  authapi:
    container_name: authapi
    build:
      context: .
      dockerfile: ./Auth.API/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Issuer: auth.api
      Jwt__Audience: AllMicroservices
      Jwt__Key: Dz65RkF0o2n023iLknkltZYz4XAMelP+mVY4le60kbY=
      Jwt__LifetimeMinutes: 15
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=IAM;Username=postgres;Password=data2010.
    ports:
      - "5002:8080"
    depends_on:
      - postgres
    networks:
      - backend

  userapi:
    container_name: userapi
    build:
      context: .
      dockerfile: ./User.API/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=IAM;Username=postgres;Password=data2010.
      Services__AuthService: http://authapi:8080
      Jwt__Issuer: auth.api
      Jwt__Audience: AllMicroservices
      Jwt__Key: Dz65RkF0o2n023iLknkltZYz4XAMelP+mVY4le60kbY=
    ports:
      - "5101:8080"
    depends_on:
      - postgres
      - authapi
    networks:
      - backend

  gestiondestockapi:
    container_name: gestiondestockapi
    build:
      context: .
      dockerfile: ./Gestion_de_stock.API/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DbConnectionString: Host=postgres;Port=5432;Database=IAM;Username=postgres;Password=data2010.
      Jwt__Issuer: auth.api
      Jwt__Audience: AllMicroservices
      Jwt__Key: Dz65RkF0o2n023iLknkltZYz4XAMelP+mVY4le60kbY=
    ports:
      - "5102:8080"
    depends_on:
      - postgres
    networks:
      - backend

  clientapi:
    container_name: clientapi
    build:
      context: .
      dockerfile: ./Client.API/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DbConnectionString: Host=postgres;Port=5432;Database=IAM;Username=postgres;Password=data2010.
      Jwt__Issuer: auth.api
      Jwt__Audience: AllMicroservices
      Jwt__Key: Dz65RkF0o2n023iLknkltZYz4XAMelP+mVY4le60kbY=
    ports:
      - "5103:8080"
    depends_on:
      - postgres
    networks:
      - backend

  commandeapi:
    container_name: commandeapi
    build:
      context: .
      dockerfile: ./Commande.API/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DbConnectionString: Host=postgres;Port=5432;Database=IAM;Username=postgres;Password=data2010.
      Jwt__Issuer: auth.api
      Jwt__Audience: AllMicroservices
      Jwt__Key: Dz65RkF0o2n023iLknkltZYz4XAMelP+mVY4le60kbY=
    ports:
      - "5104:8080"
    depends_on:
      - postgres
    networks:
      - backend

  facturationapi:
    container_name: facturationapi
    build:
      context: .
      dockerfile: ./Facturation.API/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DbConnectionString: Host=postgres;Port=5432;Database=IAM;Username=postgres;Password=data2010.
      Jwt__Issuer: auth.api
      Jwt__Audience: AllMicroservices
      Jwt__Key: Dz65RkF0o2n023iLknkltZYz4XAMelP+mVY4le60kbY=
    ports:
      - "5105:8080"
    depends_on:
      - postgres
    networks:
      - backend

  livraisonapi:
    container_name: livraisonapi
    build:
      context: .
      dockerfile: ./Livraison.API/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DbConnectionString: Host=postgres;Port=5432;Database=IAM;Username=postgres;Password=data2010.
      Jwt__Issuer: auth.api
      Jwt__Audience: AllMicroservices
      Jwt__Key: Dz65RkF0o2n023iLknkltZYz4XAMelP+mVY4le60kbY=
    ports:
      - "5106:8080"
    depends_on:
      - postgres
    networks:
      - backend

  apigateway:
    container_name: apigateway
    build:
      context: .
      dockerfile: ./Gateway/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__authCluster__Destinations__d1__Address: http://authapi:8080/
      ReverseProxy__Clusters__usersCluster__Destinations__d1__Address: http://userapi:8080/
      ReverseProxy__Clusters__stockCluster__Destinations__d1__Address: http://gestiondestockapi:8080/
      ReverseProxy__Clusters__clientCluster__Destinations__d1__Address: http://clientapi:8080/
      ReverseProxy__Clusters__commandeCluster__Destinations__d1__Address: http://commandeapi:8080/
      ReverseProxy__Clusters__facturationCluster__Destinations__d1__Address: http://facturationapi:8080/
      ReverseProxy__Clusters__livraisonCluster__Destinations__d1__Address: http://livraisonapi:8080/
    ports:
      - "5100:8080"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: