<header class="navbar">
  <div class="left">
    <div class="logo">MS</div>
    <h1>ModeShop - E-commerce Vetements</h1>
  </div>

  <div class="right" *ngIf="userService.currentUser$ | async as user; else guest">
    <span class="user">{{ userService.getDisplayName() }}</span>
    <button type="button" (click)="logout()">Logout</button>
  </div>

  <ng-template #guest>
    <a routerLink="/auth/login">Login</a>
  </ng-template>
</header>
