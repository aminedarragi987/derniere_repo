<section class="page">
  <header class="page-header">
    <div>
      <h1>Fournisseurs</h1>
      <p>Gere le reseau de fournisseurs du stock.</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-outline" (click)="loadFournisseurs()">Actualiser</button>
      <button type="button" class="btn-primary" (click)="create()">Nouveau fournisseur</button>
    </div>
  </header>

  <div class="toolbar">
    <input
      type="text"
      [(ngModel)]="search"
      (ngModelChange)="applyFilter()"
      placeholder="Rechercher nom, email, telephone..." />
  </div>

  <p class="loading" *ngIf="isLoading">Chargement des fournisseurs...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <table class="table" *ngIf="!isLoading && !errorMessage && filtered.length > 0">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let fournisseur of filtered">
        <td>{{ fournisseur.nom }}</td>
        <td>{{ fournisseur.email || '-' }}</td>
        <td>{{ fournisseur.telephone || '-' }}</td>
        <td class="actions">
          <button type="button" class="btn-secondary" (click)="edit(fournisseur.idfournisseur)">Éditer</button>
          <button type="button" class="btn-danger" (click)="delete(fournisseur.idfournisseur)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="empty" *ngIf="!isLoading && !errorMessage && filtered.length === 0">Aucun fournisseur trouvé.</p>
</section>
