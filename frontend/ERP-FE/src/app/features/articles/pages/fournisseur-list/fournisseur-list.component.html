<section class="articles-page">
  <header class="page-header">
    <div class="page-titles">
      <h1 class="title">Fournisseurs</h1>
      <p class="subtitle">Gere le reseau de fournisseurs du stock.</p>
    </div>

    <div class="header-actions">
      <div class="search-short">
        <input type="text" placeholder="Rechercher nom, email, telephone..." (input)="search = $any($event.target).value; applyFilter()" />
      </div>
      <div class="header-buttons">
        <button class="btn-outline" type="button" (click)="loadFournisseurs()">Actualiser</button>
        <button class="btn-primary" type="button" (click)="create()">Nouveau fournisseur</button>
      </div>
    </div>
  </header>

  <div class="feedback loading" *ngIf="isLoading">Chargement des fournisseurs...</div>
  <div class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="table-card" *ngIf="!isLoading && !errorMessage">
    <table class="article-table" aria-label="Liste des fournisseurs">
      <thead>
        <tr>
          <th class="col-icon"></th>
          <th class="col-name">Nom</th>
          <th class="col-desc">Email</th>
          <th class="col-phone">Téléphone</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let fournisseur of filtered" class="article-row">
          <td class="col-icon">
            <div class="row-icon"><span class="material-icons">local_shipping</span></div>
          </td>
          <td class="col-name"><strong>{{ fournisseur.nom }}</strong></td>
          <td class="col-desc">{{ fournisseur.email || '-' }}</td>
          <td class="col-phone">{{ fournisseur.telephone || '-' }}</td>
          <td class="col-actions">
            <div class="icon-actions">
              <button class="icon-btn" title="Éditer" (click)="edit(fournisseur.idfournisseur)">
                <span class="material-icons">edit</span>
              </button>
              <button class="icon-btn danger" title="Supprimer" (click)="delete(fournisseur.idfournisseur)">
                <span class="material-icons">delete</span>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="filtered.length === 0">
          <td colspan="5" class="empty">Aucun fournisseur trouvé.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
