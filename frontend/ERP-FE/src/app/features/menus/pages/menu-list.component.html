<section class="page">
  <header class="page-header">
    <h1>Menus</h1>
    <button type="button" class="btn-primary" routerLink="/menus/create">Nouveau menu</button>
  </header>

  <p class="loading" *ngIf="isLoading">Chargement...</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <table class="table" *ngIf="menus.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Titre</th>
        <th>Description</th>
        <th>RouterLink</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let menu of menus">
        <td>{{ menu.idmenu }}</td>
        <td>{{ menu.titre }}</td>
        <td>{{ menu.description }}</td>
        <td>{{ menu.memRouterlink }}</td>
        <td>
          <a class="btn-outline" [routerLink]="['/menus/edit', menu.idmenu]">Modifier</a>
          <button type="button" class="btn-danger" (click)="deleteMenu(menu)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="empty" *ngIf="!isLoading && menus.length === 0">Aucun menu trouvé.</p>
</section>
