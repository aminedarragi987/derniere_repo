<section class="page-shell">
	<header class="page-header">
		<div>
			<h1>Créer un nouveau client</h1>
			<p>Ajoute un client à ta base de données.</p>
		</div>
		<button class="btn ghost" type="button" (click)="cancel()">Retour</button>
	</header>

	<form class="form-card" [formGroup]="form" (ngSubmit)="save()">
		<label>
			Nom *
			<input type="text" formControlName="nom" placeholder="Nom complet" />
		</label>

		<label>
			Email
			<input type="email" formControlName="email" placeholder="email@client.com" />
		</label>

		<label>
			Téléphone
			<input type="text" formControlName="telephone" placeholder="+212 6 XX XX XX XX" />
		</label>

		<label>
			Adresse
			<textarea formControlName="adresse" placeholder="Adresse complète..."></textarea>
		</label>

		<div class="actions">
			<button class="btn primary" [disabled]="isSubmitting" type="submit">
				{{ isSubmitting ? 'Création...' : 'Créer le client' }}
			</button>
			<button class="btn ghost" type="button" (click)="cancel()">Annuler</button>
		</div>
	</form>
</section>
