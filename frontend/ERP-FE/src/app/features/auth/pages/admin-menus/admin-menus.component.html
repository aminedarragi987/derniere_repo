<div class="admin-container">
  <div class="header">
    <h1>Gestion des Menus</h1>
    <button class="btn-primary" (click)="toggleForm()">{{ showForm ? 'Annuler' : '+ Ajouter menu' }}</button>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form *ngIf="showForm" [formGroup]="form" (ngSubmit)="submit()" class="form-card">
    <div class="form-group">
      <label>Titre</label>
      <input type="text" formControlName="titre" class="form-control" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" class="form-control"></textarea>
    </div>
    <div class="form-group">
      <label>Route (memRouterlink)</label>
      <input type="text" formControlName="memRouterlink" class="form-control" />
    </div>
    <div class="form-group">
      <label>Icône (memIcon)</label>
      <input type="text" formControlName="memIcon" class="form-control" />
    </div>
    <button type="submit" class="btn-success">Enregistrer</button>
  </form>

  <div *ngIf="isLoading">Chargement...</div>
  <table *ngIf="!isLoading && menus.length > 0" class="table">
    <thead>
      <tr>
        <th>Titre</th>
        <th>Route</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let menu of menus">
        <td>{{ menu.titre }}</td>
        <td>{{ menu.memRouterlink }}</td>
        <td>{{ menu.description }}</td>
        <td>
          <button class="btn-sm" (click)="edit(menu)">Éditer</button>
          <button class="btn-sm btn-danger" (click)="delete(menu.idmenu)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!isLoading && menus.length === 0">Aucun menu.</div>
</div>
