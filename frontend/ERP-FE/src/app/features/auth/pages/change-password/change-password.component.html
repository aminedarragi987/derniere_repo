<section class="change-password-page">
	<div class="card">
		<h1>Changer le mot de passe</h1>

		<div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
		<div class="success" *ngIf="successMessage">{{ successMessage }}</div>

		<form [formGroup]="form" (ngSubmit)="submit()">
			<label>
				<span>Mot de passe actuel</span>
				<input type="password" formControlName="currentPassword" />
			</label>

			<label>
				<span>Nouveau mot de passe</span>
				<input type="password" formControlName="newPassword" />
			</label>

			<label>
				<span>Confirmer nouveau mot de passe</span>
				<input type="password" formControlName="confirmPassword" />
			</label>

			<div class="actions">
				<button class="btn-light" type="button" (click)="goBack()">Retour</button>
				<button class="btn-primary" [disabled]="isSubmitting" type="submit">Valider</button>
			</div>
		</form>
	</div>
</section>
