<div class="admin-container">
  <div class="header">
    <h1>Gestion des Profils</h1>
    <button class="btn-primary" (click)="toggleForm()">{{ showForm ? 'Annuler' : '+ Ajouter profil' }}</button>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form *ngIf="showForm" [formGroup]="form" (ngSubmit)="submit()" class="form-card">
    <div class="form-group">
      <label>Nom</label>
      <input type="text" formControlName="nom" class="form-control" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" class="form-control"></textarea>
    </div>
    <button type="submit" class="btn-success">Enregistrer</button>
  </form>

  <div *ngIf="isLoading">Chargement...</div>
  <table *ngIf="!isLoading && profiles.length > 0" class="table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let profile of profiles">
        <td>{{ profile.nom }}</td>
        <td>{{ profile.description }}</td>
        <td>
          <button class="btn-sm" (click)="edit(profile)">Éditer</button>
          <button class="btn-sm btn-danger" (click)="delete(profile.idprofil)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!isLoading && profiles.length === 0">Aucun profil.</div>
</div>
