<div class="admin-container">
  <div class="header">
    <h1>Gestion des Rôles</h1>
    <button class="btn-primary" (click)="toggleForm()">{{ showForm ? 'Annuler' : '+ Ajouter rôle' }}</button>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form *ngIf="showForm" [formGroup]="form" (ngSubmit)="submit()" class="form-card">
    <div class="form-group">
      <label>Nom</label>
      <input type="text" formControlName="nom" class="form-control" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" class="form-control"></textarea>
    </div>
    <button type="submit" class="btn-success">Enregistrer</button>
  </form>

  <div *ngIf="isLoading" class="loading">Chargement...</div>
  <table *ngIf="!isLoading && roles.length > 0" class="table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let role of roles">
        <td>{{ role.nom }}</td>
        <td>{{ role.description }}</td>
        <td>
          <button class="btn-sm" (click)="edit(role)">Éditer</button>
          <button class="btn-sm btn-danger" (click)="delete(role.idrole)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!isLoading && roles.length === 0" class="empty">Aucun rôle.</div>
</div>
