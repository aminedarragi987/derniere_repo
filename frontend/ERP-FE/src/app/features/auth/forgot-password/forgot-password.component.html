<section class="forgot-password-page">
	<div class="forgot-password-card">
		<p class="eyebrow">Acces compte</p>
		<h1>Mot de passe oublie</h1>
		<p class="description">
			Saisis ton adresse email pour recevoir les instructions de reinitialisation.
		</p>

		<div class="success" *ngIf="successMessage">{{ successMessage }}</div>
		<div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

		<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
			<label>
				<span>Email</span>
				<input type="email" formControlName="email" placeholder="nom@entreprise.com" />
				<small class="validation" *ngIf="form.controls.email.touched && form.controls.email.invalid">
					Adresse email valide requise.
				</small>
			</label>

			<button class="btn-primary" type="submit" [disabled]="isSubmitting">
				{{ isSubmitting ? 'Envoi...' : 'Envoyer le lien' }}
			</button>
		</form>

		<a routerLink="/auth/login" class="link">Retour a la connexion</a>
	</div>
</section>
