<div class="page">
	<div class="page-header">
		<div>
			<h2>Factures</h2>
			<p>Consultez et gérez les factures clients.</p>
		</div>
	</div>

	<div class="toolbar">
		<input
			type="number"
			[(ngModel)]="commandeId"
			placeholder="ID commande"
		/>
		<button (click)="genererFacture()">+ Générer facture</button>
	</div>

	<div *ngIf="error" class="error">
		{{ error }}
	</div>

	<div *ngIf="loading" class="loading">
		Chargement...
	</div>

	<table *ngIf="!loading" class="table">
		<thead>
			<tr>
				<th>ID Facture</th>
				<th>ID Commande</th>
				<th>Montant TTC</th>
				<th>Statut</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let facture of factures">
				<td>{{ facture.idfacture }}</td>
				<td>{{ facture.idcommande }}</td>
				<td>{{ facture.montantttc }} TND</td>
				<td>{{ facture.statut }}</td>
				<td>
					<button (click)="ajouterPaiement(facture)">
						Ajouter paiement
					</button>
				</td>
			</tr>
			<tr *ngIf="factures.length === 0">
				<td colspan="5">Aucune facture trouvée.</td>
			</tr>
		</tbody>
	</table>
</div>
